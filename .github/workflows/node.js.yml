name: Legendary CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legendary-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check and build server
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      # Intentionally no smoke/E2E/unit test command: release policy is build-only.
      - name: Type-check source
        run: npm run typecheck

      - name: Build server
        run: npm run build

      - name: Upload server artifact
        uses: actions/upload-artifact@v7
        with:
          name: legendary-dist
          path: dist
          if-no-files-found: error
          retention-days: 14

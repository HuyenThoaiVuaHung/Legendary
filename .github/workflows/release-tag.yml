name: Legendary Release Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without the v prefix (for example 2.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag:
    name: Tag Legendary release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be SemVer, e.g. 2.1.0" >&2
            exit 1
          fi
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION"; then
            echo "Tag v$VERSION already exists" >&2
            exit 1
          fi

      - name: Create annotated tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Legendary v$VERSION"
          git push origin "v$VERSION"
